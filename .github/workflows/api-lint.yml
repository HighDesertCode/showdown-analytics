name: API Lint

on:
  pull_request:
    paths:
      - "api/**"
      - "tests/api/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/api-lint.yml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Repository Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install Dependencies
        run: uv sync --locked --group api

      - name: Lint
        run: uv run --group api ruff check api tests/api

      - name: Check Formatting
        run: uv run --group api ruff format --check api tests/api
