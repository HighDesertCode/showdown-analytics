# Unit tests: fixed input rows and the exact rows each model should return. They need no loaded data,
# so CI runs them against empty tables. Only the columns a test depends on are listed.
unit_tests:
  - name: replay_battle_event_adds_battles_whose_parse_is_new
    description: >
      An incremental build takes each battle whose current parse isn't in the table: a re-parsed battle (b), and a new
      one (c) even though its parse is older than b's, as when two parse runs commit out of order. dbt then replaces
      b's old rows. Battle a is unchanged and is left alone.
    model: replay_battle_event
    overrides:
      macros:
        is_incremental: true
    given:
      # The table may not exist yet when unit tests run, so dbt can't read its columns; SQL needs none.
      - input: this
        format: sql
        rows: |
          SELECT replay_id, parsed_at::TIMESTAMPTZ AS parsed_at
          FROM (VALUES ('a', '2026-11-01 09:00:00+00'), ('b', '2026-11-01 09:00:00+00')) AS event (replay_id, parsed_at)
      - input: ref('stg_battle')
        format: sql
        rows: |
          SELECT replay_id, parsed_at::TIMESTAMPTZ AS parsed_at
          FROM (
              VALUES
                  ('a', '2026-11-01 09:00:00+00'),
                  ('b', '2026-11-02 09:00:00+00'),
                  ('c', '2026-11-01 08:00:00+00')
          ) AS battle (replay_id, parsed_at)
      - input: ref('stg_battle_event')
        rows:
          - {replay_id: a, seq: 1}
          - {replay_id: b, seq: 1}
          - {replay_id: c, seq: 1}
          - {replay_id: c, seq: 2}
      - input: ref('stg_battle_pokemon')
        rows: []
      - input: source('reference', 'species')
        rows: []
    expect:
      rows:
        - {replay_id: b, seq: 1, parsed_at: "2026-11-02 09:00:00+00"}
        - {replay_id: c, seq: 1, parsed_at: "2026-11-01 08:00:00+00"}
        - {replay_id: c, seq: 2, parsed_at: "2026-11-01 08:00:00+00"}

  - name: replay_battle_event_loads_every_battle_into_an_empty_table
    description: An empty table holds no parse, so an incremental build into it takes every battle.
    model: replay_battle_event
    overrides:
      macros:
        is_incremental: true
    given:
      - input: this
        format: sql
        rows: |
          SELECT NULL::TEXT AS replay_id, NULL::TIMESTAMPTZ AS parsed_at WHERE FALSE
      - input: ref('stg_battle')
        format: sql
        rows: |
          SELECT 'a' AS replay_id, '2026-11-01 09:00:00+00'::TIMESTAMPTZ AS parsed_at
      - input: ref('stg_battle_event')
        rows:
          - {replay_id: a, seq: 1}
      - input: ref('stg_battle_pokemon')
        rows: []
      - input: source('reference', 'species')
        rows: []
    expect:
      rows:
        - {replay_id: a, seq: 1, parsed_at: "2026-11-01 09:00:00+00"}

  - name: replay_battle_event_follows_each_pokemons_form
    description: >
      Events take the form a Pokémon last showed. Urshifu-* enters as Urshifu-Rapid-Strike, and Maushold, the target,
      as Maushold-Four. Mimikyu becomes Mimikyu-Busted mid-battle. A Zoroark-Hisui disguised as Urshifu-Rapid-Strike
      switches in showing that species, which isn't its own, so it keeps its previewed species before and after the
      Illusion ends. Maushold is previewed twice (possible without Species Clause), and its events still appear once.
    model: replay_battle_event
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_battle')
        format: sql
        rows: |
          SELECT 'a' AS replay_id, '2026-11-01 09:00:00+00'::TIMESTAMPTZ AS parsed_at
      - input: ref('stg_battle_event')
        rows:
          - {replay_id: a, seq: 1, side: p1, pokemon: "Urshifu-*", event: switch, detail: Urshifu-Rapid-Strike}
          - {replay_id: a, seq: 2, side: p2, pokemon: Maushold, event: switch, detail: Maushold-Four}
          - {replay_id: a, seq: 3, side: p1, pokemon: "Urshifu-*", event: move, detail: Surging Strikes, target_side: p2, target_pokemon: Maushold}
          - {replay_id: a, seq: 4, side: p1, pokemon: Mimikyu, event: switch, detail: Mimikyu}
          - {replay_id: a, seq: 5, side: p1, pokemon: Mimikyu, event: form, detail: Mimikyu-Busted}
          - {replay_id: a, seq: 6, side: p1, pokemon: Mimikyu, event: move, detail: Play Rough, target_side: p2, target_pokemon: Maushold}
          - {replay_id: a, seq: 7, side: p1, pokemon: Zoroark-Hisui, event: switch, detail: Urshifu-Rapid-Strike}
          - {replay_id: a, seq: 8, side: p1, pokemon: Zoroark-Hisui, event: move, detail: Shadow Ball, target_side: p2, target_pokemon: Maushold}
          - {replay_id: a, seq: 9, side: p1, pokemon: Zoroark-Hisui, event: replace, detail: Zoroark-Hisui}
          - {replay_id: a, seq: 10, event: weather, detail: RainDance}
      - input: ref('stg_battle_pokemon')
        rows:
          - {replay_id: a, side: p1, previewed_species: "Urshifu-*", species_id: 1}
          - {replay_id: a, side: p1, previewed_species: Mimikyu, species_id: 3}
          - {replay_id: a, side: p1, previewed_species: Zoroark-Hisui, species_id: 5}
          - {replay_id: a, side: p2, previewed_species: Maushold, species_id: 7}
          - {replay_id: a, side: p2, previewed_species: Maushold, species_id: 7}
      - input: source('reference', 'species')
        rows:
          - {species_id: 1, showdown_id: urshifu, name: Urshifu, base_species: null}
          - {species_id: 2, showdown_id: urshifurapidstrike, name: Urshifu-Rapid-Strike, base_species: Urshifu}
          - {species_id: 3, showdown_id: mimikyu, name: Mimikyu, base_species: null}
          - {species_id: 4, showdown_id: mimikyubusted, name: Mimikyu-Busted, base_species: Mimikyu}
          - {species_id: 5, showdown_id: zoroarkhisui, name: Zoroark-Hisui, base_species: Zoroark}
          - {species_id: 7, showdown_id: maushold, name: Maushold, base_species: null}
          - {species_id: 8, showdown_id: mausholdfour, name: Maushold-Four, base_species: Maushold}
    expect:
      rows:
        - {seq: 1, species_id: 2, target_species_id: null}
        - {seq: 2, species_id: 8, target_species_id: null}
        - {seq: 3, species_id: 2, target_species_id: 8}
        - {seq: 4, species_id: 3, target_species_id: null}
        - {seq: 5, species_id: 4, target_species_id: null}
        - {seq: 6, species_id: 4, target_species_id: 8}
        - {seq: 7, species_id: 5, target_species_id: null}
        - {seq: 8, species_id: 5, target_species_id: 8}
        - {seq: 9, species_id: 5, target_species_id: null}
        - {seq: 10, species_id: null, target_species_id: null}
