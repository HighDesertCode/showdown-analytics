models:
  - name: stg_source_file
    description: The latest version of each Smogon file.
    columns:
      - name: source_file_id
        data_tests: [unique, not_null]
      - name: url
        data_tests: [unique, not_null]
      - name: family
        data_tests:
          - accepted_values:
              arguments:
                values: [chaos, usage, leads, metagame, matchup_chart]

  - name: stg_usage_pokemon
    description: Usage report rows matched to reference.species.
    data_tests:
      - unique:
          arguments:
            column_name: "source_file_id || '-' || species_id"
    columns:
      - name: species_id
        description: Null when Smogon's name matches no species; the not_null test turns that into a failure.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: source('reference', 'species')
                field: species_id

  - name: stg_usage_report
    description: Battle count and average weight per team for each usage report.
    columns:
      - name: source_file_id
        data_tests: [unique, not_null]

  - name: stg_leads_pokemon
    description: Leads report rows matched to reference.species.
    data_tests:
      - unique:
          arguments:
            column_name: "source_file_id || '-' || species_id"
    columns:
      - name: species_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: source('reference', 'species')
                field: species_id

  - name: stg_metagame_report
    description: Average stalliness per metagame report.
    columns:
      - name: source_file_id
        data_tests: [unique, not_null]

  - name: stg_metagame_tag
    description: Metagame tags, with type tags matched to reference.type.
    data_tests:
      - unique:
          arguments:
            column_name: "source_file_id || '-' || tag"

  - name: stg_matchup_chart_cell
    description: Matchup chart cells matched to reference.type.
    data_tests:
      - unique:
          arguments:
            column_name: "source_file_id || '-' || type_id || '-' || opponent_type_id"
    columns:
      - name: type_id
        data_tests: [not_null]
      - name: opponent_type_id
        data_tests: [not_null]

  - name: stg_matchup_chart_viability
    description: Smogon's ViabilityScore per type, matched to reference.type.
    data_tests:
      - unique:
          arguments:
            column_name: "source_file_id || '-' || type_id"
    columns:
      - name: type_id
        data_tests: [not_null]

  - name: stg_chaos_pokemon
    description: Chaos report Pokémon matched to reference.species, with the option denominator.
    data_tests:
      - unique:
          arguments:
            column_name: "source_file_id || '-' || species_id"
    columns:
      - name: chaos_pokemon_id
        data_tests: [unique, not_null]
      - name: species_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: source('reference', 'species')
                field: species_id
      - name: ability_weight_total
        data_tests: [not_null]

  - name: stg_chaos_ability
    columns:
      - name: ability_id
        data_tests: [not_null]

  - name: stg_chaos_item
    columns:
      - name: item_id
        description: Null only for Smogon's "nothing" (no held item).
        data_tests:
          - not_null:
              config:
                where: has_item

  - name: stg_chaos_move
    columns:
      - name: move_id
        description: Null only for Smogon's empty label (an unused move slot).
        data_tests:
          - not_null:
              config:
                where: NOT is_empty_slot

  - name: stg_chaos_spread
    columns:
      - name: nature_id
        data_tests: [not_null]
      - name: hp_evs
        data_tests: [not_null]
      - name: spe_evs
        data_tests: [not_null]

  - name: stg_chaos_teammate
    columns:
      - name: teammate_species_id
        description: Null only for Smogon's "empty" (an unfilled team slot).
        data_tests:
          - not_null:
              config:
                where: NOT is_empty_slot

  - name: stg_chaos_counter
    data_tests:
      - unique:
          arguments:
            column_name: "chaos_pokemon_id || '-' || opponent_species_id"
    columns:
      - name: opponent_species_id
        data_tests: [not_null]

  - name: stg_battle
    description: Each parsed public replay, with its format and the UTC month it started in.
    columns:
      - name: replay_id
        data_tests: [unique, not_null]
      - name: report_month
        data_tests: [not_null]

  - name: stg_battle_side
    description: >
      Each player in a parsed battle, with their Elo band and their team's inferred type. Elo is Showdown's ladder
      rating, never comparable to Smogon's Glicko-weighted baselines.
    data_tests:
      - unique:
          arguments:
            column_name: "replay_id || '-' || side"
    columns:
      - name: elo_band
        description: >
          The lower bound of the player's Elo before the battle: 1000 (the ladder's floor, up to 1199), 1200, 1400,
          or 1600 and up. Null in unrated battles.
        data_tests:
          - accepted_values:
              arguments:
                values: [1000, 1200, 1400, 1600]
      - name: team_type
        description: >
          The one type every previewed Pokémon shares, inferred rather than read from the log; null when they share
          none or more than one.

  - name: stg_battle_pokemon
    description: Each previewed Pokémon matched to reference.species.
    data_tests:
      - unique:
          arguments:
            column_name: "replay_id || '-' || side || '-' || slot"
    columns:
      - name: species_id
        description: Null when the preview matches no species; the not_null test turns that into a failure.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: source('reference', 'species')
                field: species_id
      - name: form_hidden
        description: The preview hides which form it is (e.g. "Urshifu-*"); species_id is then the base species.

  - name: stg_battle_event
    description: >
      Each game event in a parsed battle; replay_battle_event works out each Pokémon's form. Not tested for
      uniqueness, which raw.battle_event's primary key guarantees, so the daily build doesn't scan every event.
