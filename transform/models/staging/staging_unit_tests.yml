# Unit tests: fixed input rows and the exact rows each model should return. They need no loaded data,
# so CI runs them against empty tables. Only the columns a test depends on are listed.
unit_tests:
  - name: stg_source_file_keeps_latest_version
    description: >
      When Smogon republishes a file, the newer retrieval replaces the older one; per-type files get their
      team type's Showdown ID and overall files get null.
    model: stg_source_file
    given:
      - input: source('raw', 'source_file')
        rows:
          - {source_file_id: 1, url: "https://www.smogon.com/stats/2026-09/gen9monotype-1630.txt", retrieved_at: "2026-10-01 00:00:00+00", team_type_id: null}
          - {source_file_id: 2, url: "https://www.smogon.com/stats/2026-09/gen9monotype-1630.txt", retrieved_at: "2026-10-05 00:00:00+00", team_type_id: null}
          - {source_file_id: 3, url: "https://www.smogon.com/stats/2026-09/monotype/gen9monotype-monowater-1630.txt", retrieved_at: "2026-10-01 00:00:00+00", team_type_id: 11}
      - input: source('reference', 'type')
        rows:
          - {type_id: 11, showdown_id: water}
    expect:
      rows:
        - {source_file_id: 2, team_type: null}
        - {source_file_id: 3, team_type: water}

  - name: stg_chaos_pokemon_totals_ability_weights
    description: >
      ability_weight_total adds up only a Pokémon's ability weights (water Swampert: Torrent 1209.081 + Damp
      220.313 = 1429.394), not its items or other options. Names match species by Showdown ID, which drops
      spaces, hyphens, and apostrophes ("Oricorio-Pa'u" becomes oricoriopau).
    model: stg_chaos_pokemon
    given:
      - input: source('raw', 'chaos_pokemon')
        rows:
          - {chaos_pokemon_id: 1, source_file_id: 5, pokemon: Swampert}
          - {chaos_pokemon_id: 2, source_file_id: 5, pokemon: "Oricorio-Pa'u"}
          - {chaos_pokemon_id: 3, source_file_id: 5, pokemon: Iron Valiant}
      - input: source('raw', 'chaos_option')
        rows:
          - {chaos_pokemon_id: 1, category: abilities, label: torrent, weight: 1209.0809208735927}
          - {chaos_pokemon_id: 1, category: abilities, label: damp, weight: 220.3128437707143}
          - {chaos_pokemon_id: 1, category: items, label: leftovers, weight: 848.989}
          - {chaos_pokemon_id: 2, category: abilities, label: dancer, weight: 12.5}
          - {chaos_pokemon_id: 3, category: abilities, label: quarkdrive, weight: 640.25}
      - input: ref('stg_source_file')
        rows:
          - {source_file_id: 5, format: gen9monotype, report_month: 2026-09-01, baseline: 1630, team_type: water}
      - input: source('raw', 'chaos_report')
        rows:
          - {source_file_id: 5, battle_count: 63572}
      - input: source('reference', 'species')
        rows:
          - {species_id: 10, showdown_id: swampert}
          - {species_id: 20, showdown_id: oricoriopau}
          - {species_id: 30, showdown_id: ironvaliant}
    expect:
      rows:
        - {chaos_pokemon_id: 1, species_id: 10, ability_weight_total: 1429.393764644307}
        - {chaos_pokemon_id: 2, species_id: 20, ability_weight_total: 12.5}
        - {chaos_pokemon_id: 3, species_id: 30, ability_weight_total: 640.25}

  - name: stg_chaos_spread_splits_nature_and_evs
    description: >
      Each spread label splits into its nature, matched to reference.nature, and six EVs in HP/Atk/Def/SpA/SpD/Spe
      order (water Swampert's "Adamant:236/76/176/0/8/12" has six different values, so any swapped column fails).
      Only spread options are kept, and the original label stays.
    model: stg_chaos_spread
    given:
      - input: source('raw', 'chaos_option')
        rows:
          - {chaos_pokemon_id: 1, category: spreads, label: "Careful:248/0/0/0/252/8", weight: 297.641840552464}
          - {chaos_pokemon_id: 1, category: spreads, label: "Adamant:236/76/176/0/8/12", weight: 0.7124150650686821}
          - {chaos_pokemon_id: 1, category: abilities, label: torrent, weight: 1209.0809208735927}
      - input: ref('stg_chaos_pokemon')
        rows:
          - {chaos_pokemon_id: 1}
      - input: source('reference', 'nature')
        rows:
          - {nature_id: 4, showdown_id: adamant}
          - {nature_id: 22, showdown_id: careful}
    expect:
      rows:
        - {nature_id: 22, label: "Careful:248/0/0/0/252/8", hp_evs: 248, atk_evs: 0, def_evs: 0, spa_evs: 0, spd_evs: 252, spe_evs: 8, weight: 297.641840552464}
        - {nature_id: 4, label: "Adamant:236/76/176/0/8/12", hp_evs: 236, atk_evs: 76, def_evs: 176, spa_evs: 0, spd_evs: 8, spe_evs: 12, weight: 0.7124150650686821}

  - name: stg_metagame_tag_matches_type_tags
    description: >
      A tag of "mono" plus a type's Showdown ID gets that type in tag_team_type (water's "monowater"). Other
      tags keep a null tag_team_type, including "monotype", which every team has but names no type.
    model: stg_metagame_tag
    given:
      - input: source('raw', 'metagame_tag')
        rows:
          - {source_file_id: 7, tag: monowater, percent: 100.00000}
          - {source_file_id: 7, tag: monotype, percent: 100.00000}
          - {source_file_id: 7, tag: stall, percent: 69.96818}
          - {source_file_id: 7, tag: rain, percent: 28.11969}
      - input: ref('stg_source_file')
        rows:
          - {source_file_id: 7, format: gen9monotype, report_month: 2026-09-01, baseline: 1630, team_type: water}
      - input: source('reference', 'type')
        rows:
          - {type_id: 6, showdown_id: fire}
          - {type_id: 11, showdown_id: water}
    expect:
      rows:
        - {team_type: water, tag: monowater, tag_team_type: water, percent: 100.00000}
        - {team_type: water, tag: monotype, tag_team_type: null, percent: 100.00000}
        - {team_type: water, tag: stall, tag_team_type: null, percent: 69.96818}
        - {team_type: water, tag: rain, tag_team_type: null, percent: 28.11969}

  - name: stg_battle_reports_the_utc_month
    description: >
      A battle belongs to the UTC month it started in, so one starting at 23:30 Pacific on October 31 (07:30 UTC on
      November 1) is a November battle. Its replay page is Showdown's URL for its ID.
    model: stg_battle
    given:
      # The inputs and expected rows are SQL because dbt can't write a typed null for an array column.
      - input: source('raw', 'battle')
        format: sql
        rows: |
          SELECT
              replay_id, started_at::TIMESTAMPTZ AS started_at, NULL::BOOLEAN AS rated, NULL::TIMESTAMPTZ AS ended_at,
              NULL::SMALLINT AS turns, NULL::TEXT AS winner, NULL::TEXT AS ended_by, NULL::TEXT[] AS rules,
              NULL::TIMESTAMPTZ AS parsed_at
          FROM (
              VALUES
                  ('gen9monotype-2691037303', '2026-10-01 14:11:26+00'),
                  ('gen9monotype-2703725750', '2026-10-31 23:30:00-08')
          ) AS battle (replay_id, started_at)
      - input: source('raw', 'replay')
        format: sql
        rows: |
          SELECT
              replay_id, 'gen9monotype' AS format_id, NULL::TEXT AS format, NULL::TEXT[] AS players,
              NULL::INTEGER AS rating, NULL::TIMESTAMPTZ AS uploaded_at, NULL::TEXT AS log,
              NULL::TIMESTAMPTZ AS retrieved_at
          FROM (VALUES ('gen9monotype-2691037303'), ('gen9monotype-2703725750')) AS replay (replay_id)
    expect:
      format: sql
      rows: |
        SELECT
            replay_id, 'gen9monotype' AS format, report_month::DATE AS report_month,
            'https://replay.pokemonshowdown.com/' || replay_id AS replay_url, NULL::BOOLEAN AS rated,
            started_at::TIMESTAMPTZ AS started_at, NULL::TIMESTAMPTZ AS ended_at, NULL::SMALLINT AS turns,
            NULL::TEXT AS winner, NULL::TEXT AS ended_by, NULL::TEXT[] AS rules, NULL::TIMESTAMPTZ AS uploaded_at,
            NULL::TIMESTAMPTZ AS parsed_at
        FROM (
            VALUES
                ('gen9monotype-2691037303', '2026-10-01', '2026-10-01 14:11:26+00'),
                ('gen9monotype-2703725750', '2026-11-01', '2026-10-31 23:30:00-08')
        ) AS battle (replay_id, report_month, started_at)

  - name: stg_battle_pokemon_matches_hidden_and_cosmetic_forms
    description: >
      A hidden form ("Urshifu-*") matches its base species and is flagged; a cosmetic form missing from
      reference.species ("Gastrodon-East") matches its base species; a hyphenated name that is listed ("Ting-Lu")
      matches itself, not "Ting".
    model: stg_battle_pokemon
    given:
      - input: source('raw', 'battle_pokemon')
        rows:
          - {replay_id: a, side: p1, slot: 1, species: "Urshifu-*"}
          - {replay_id: a, side: p1, slot: 2, species: Gastrodon-East}
          - {replay_id: a, side: p1, slot: 3, species: Ting-Lu}
      - input: source('reference', 'species')
        rows:
          - {species_id: 1, showdown_id: urshifu}
          - {species_id: 2, showdown_id: gastrodon}
          - {species_id: 3, showdown_id: tinglu}
          - {species_id: 4, showdown_id: ting}
    expect:
      rows:
        - {slot: 1, species_id: 1, form_hidden: true}
        - {slot: 2, species_id: 2, form_hidden: false}
        - {slot: 3, species_id: 3, form_hidden: false}

  - name: stg_battle_side_infers_team_types_and_elo_bands
    description: >
      A team's type is the one type all its Pokémon share. Urshifu-* could be Dark or Water, so it fits a Dark team
      (a). A team sharing two types (all Fire/Ghost) or one with an unmatched Pokémon gets null. Elo bands start at
      1000, 1200, 1400, and 1600, and are null when the battle is unrated.
    model: stg_battle_side
    given:
      - input: source('raw', 'battle_side')
        rows:
          - {replay_id: a, side: p1, elo_before: 1199}
          - {replay_id: a, side: p2, elo_before: 1200}
          - {replay_id: b, side: p1, elo_before: 1599}
          - {replay_id: b, side: p2, elo_before: 1600}
          - {replay_id: c, side: p1, elo_before: null}
      - input: ref('stg_battle_pokemon')
        rows:
          - {replay_id: a, side: p1, slot: 1, species_id: 1, form_hidden: true}
          - {replay_id: a, side: p1, slot: 2, species_id: 3, form_hidden: false}
          - {replay_id: a, side: p2, slot: 1, species_id: 4, form_hidden: false}
          - {replay_id: a, side: p2, slot: 2, species_id: 5, form_hidden: false}
          - {replay_id: b, side: p1, slot: 1, species_id: null, form_hidden: false}
          - {replay_id: b, side: p1, slot: 2, species_id: 3, form_hidden: false}
          - {replay_id: b, side: p2, slot: 1, species_id: 6, form_hidden: false}
          - {replay_id: b, side: p2, slot: 2, species_id: 3, form_hidden: false}
      - input: source('reference', 'species')
        rows:
          - {species_id: 1, name: Urshifu, base_species: null, type_1_id: 2, type_2_id: 16}
          - {species_id: 2, name: Urshifu-Rapid-Strike, base_species: Urshifu, type_1_id: 2, type_2_id: 11}
          - {species_id: 3, name: Ting-Lu, base_species: null, type_1_id: 16, type_2_id: 9}
          - {species_id: 4, name: Chandelure, base_species: null, type_1_id: 8, type_2_id: 10}
          - {species_id: 5, name: Skeledirge, base_species: null, type_1_id: 10, type_2_id: 8}
          - {species_id: 6, name: Kingambit, base_species: null, type_1_id: 16, type_2_id: 17}
      - input: source('reference', 'type')
        rows:
          - {type_id: 16, showdown_id: dark}
    expect:
      rows:
        - {replay_id: a, side: p1, elo_band: 1000, team_type_id: 16, team_type: dark}
        - {replay_id: a, side: p2, elo_band: 1200, team_type_id: null, team_type: null}
        - {replay_id: b, side: p1, elo_band: 1400, team_type_id: null, team_type: null}
        - {replay_id: b, side: p2, elo_band: 1600, team_type_id: 16, team_type: dark}
        - {replay_id: c, side: p1, elo_band: null, team_type_id: null, team_type: null}
