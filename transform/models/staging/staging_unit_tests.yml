# Unit tests: fixed input rows and the exact rows each model should return. They need no loaded data,
# so CI runs them against empty tables. Only the columns a test depends on are listed.
unit_tests:
  - name: stg_source_file_keeps_latest_version
    description: >
      When Smogon republishes a file, the newer retrieval replaces the older one; per-type files get their
      team type's Showdown ID and overall files get null.
    model: stg_source_file
    given:
      - input: source('raw', 'source_file')
        rows:
          - {source_file_id: 1, url: "https://www.smogon.com/stats/2026-09/gen9monotype-1630.txt", retrieved_at: "2026-10-01 00:00:00+00", team_type_id: null}
          - {source_file_id: 2, url: "https://www.smogon.com/stats/2026-09/gen9monotype-1630.txt", retrieved_at: "2026-10-05 00:00:00+00", team_type_id: null}
          - {source_file_id: 3, url: "https://www.smogon.com/stats/2026-09/monotype/gen9monotype-monowater-1630.txt", retrieved_at: "2026-10-01 00:00:00+00", team_type_id: 11}
      - input: source('reference', 'type')
        rows:
          - {type_id: 11, showdown_id: water}
    expect:
      rows:
        - {source_file_id: 2, team_type: null}
        - {source_file_id: 3, team_type: water}

  - name: stg_chaos_pokemon_totals_ability_weights
    description: >
      ability_weight_total adds up only a Pokémon's ability weights (water Swampert: Torrent 1209.081 + Damp
      220.313 = 1429.394), not its items or other options. Names match species by Showdown ID, which drops
      spaces, hyphens, and apostrophes ("Oricorio-Pa'u" becomes oricoriopau).
    model: stg_chaos_pokemon
    given:
      - input: source('raw', 'chaos_pokemon')
        rows:
          - {chaos_pokemon_id: 1, source_file_id: 5, pokemon: Swampert}
          - {chaos_pokemon_id: 2, source_file_id: 5, pokemon: "Oricorio-Pa'u"}
          - {chaos_pokemon_id: 3, source_file_id: 5, pokemon: Iron Valiant}
      - input: source('raw', 'chaos_option')
        rows:
          - {chaos_pokemon_id: 1, category: abilities, label: torrent, weight: 1209.0809208735927}
          - {chaos_pokemon_id: 1, category: abilities, label: damp, weight: 220.3128437707143}
          - {chaos_pokemon_id: 1, category: items, label: leftovers, weight: 848.989}
          - {chaos_pokemon_id: 2, category: abilities, label: dancer, weight: 12.5}
          - {chaos_pokemon_id: 3, category: abilities, label: quarkdrive, weight: 640.25}
      - input: ref('stg_source_file')
        rows:
          - {source_file_id: 5, format: gen9monotype, report_month: 2026-09-01, baseline: 1630, team_type: water}
      - input: source('raw', 'chaos_report')
        rows:
          - {source_file_id: 5, battle_count: 63572}
      - input: source('reference', 'species')
        rows:
          - {species_id: 10, showdown_id: swampert}
          - {species_id: 20, showdown_id: oricoriopau}
          - {species_id: 30, showdown_id: ironvaliant}
    expect:
      rows:
        - {chaos_pokemon_id: 1, species_id: 10, ability_weight_total: 1429.393764644307}
        - {chaos_pokemon_id: 2, species_id: 20, ability_weight_total: 12.5}
        - {chaos_pokemon_id: 3, species_id: 30, ability_weight_total: 640.25}

  - name: stg_chaos_spread_splits_nature_and_evs
    description: >
      Each spread label splits into its nature, matched to reference.nature, and six EVs in HP/Atk/Def/SpA/SpD/Spe
      order (water Swampert's "Adamant:236/76/176/0/8/12" has six different values, so any swapped column fails).
      Only spread options are kept, and the original label stays.
    model: stg_chaos_spread
    given:
      - input: source('raw', 'chaos_option')
        rows:
          - {chaos_pokemon_id: 1, category: spreads, label: "Careful:248/0/0/0/252/8", weight: 297.641840552464}
          - {chaos_pokemon_id: 1, category: spreads, label: "Adamant:236/76/176/0/8/12", weight: 0.7124150650686821}
          - {chaos_pokemon_id: 1, category: abilities, label: torrent, weight: 1209.0809208735927}
      - input: ref('stg_chaos_pokemon')
        rows:
          - {chaos_pokemon_id: 1}
      - input: source('reference', 'nature')
        rows:
          - {nature_id: 4, showdown_id: adamant}
          - {nature_id: 22, showdown_id: careful}
    expect:
      rows:
        - {nature_id: 22, label: "Careful:248/0/0/0/252/8", hp_evs: 248, atk_evs: 0, def_evs: 0, spa_evs: 0, spd_evs: 252, spe_evs: 8, weight: 297.641840552464}
        - {nature_id: 4, label: "Adamant:236/76/176/0/8/12", hp_evs: 236, atk_evs: 76, def_evs: 176, spa_evs: 0, spd_evs: 8, spe_evs: 12, weight: 0.7124150650686821}
