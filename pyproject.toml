[project]
name = "showdown-analytics"
version = "0.1.0"
description = "Source-attributed Pokemon Showdown analytics"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "json5>=0.17.3",
    "psycopg[binary]>=3.3.6",
]

[project.scripts]
pipelines = "pipelines.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipelines"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
