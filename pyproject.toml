[project]
name = "showdown-analytics"
version = "0.1.0"
description = "Source-attributed Pokemon Showdown analytics"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "json5==0.17.3",
    "psycopg[binary]==3.3.6",
]

[project.scripts]
pipelines = "pipelines.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipelines"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
# The repo root, so tests can import api/, which isn't installed as a package.
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "pytest==9.1.1",
    "ruff==0.17.2",
    "ty==0.0.92",
]
# dbt for transform/; installed only when requested (uv run --group dbt ...).
dbt = [
    "dbt-core==1.12.6",
    "dbt-postgres==1.11.0",
]
# The public API in api/; installed only when requested (uv run --group api ...). It isn't in the wheel, so the
# pipelines image never includes it.
api = [
    "fastapi==0.162.0",
    "psycopg-pool==3.3.3",
    "uvicorn==0.54.0",
]
